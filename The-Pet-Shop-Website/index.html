<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pet Shop Website</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
        <a href="#video">Video</a>
    </nav>

    <section id="home">
        <h1>Welcome to The Pet Shop</h1>
        <p>Your friendly place for pets, supplies, and care.</p>
    </section>

   <section id="gallery">
    <h2>Pet Gallery</h2>

    <img src="images/dog1.jpg" alt="Dog 1" width="250">
    <img src="images/dog2.jpg" alt="Dog 2" width="250">
    <img src="images/cat1.jpg" alt="Cat 1" width="250">
</section>

    <section id="contact">
        <h2>Contact Us</h2>

        <form>
            <input type="text" placeholder="Enter your name">
            <input type="email" placeholder="Enter your email">
            <textarea placeholder="How can we help you?"></textarea>
            <input type="submit" value="Submit">
        </form>
    </section>

    <section id="video">
        <h2>Pet Care Video</h2>

        <video controls>
            <source src="video/dog.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <footer>
        <p>The Pet Shop Website Assignment</p>
    </footer>

</body>
</html>
