<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="#home">Home</a> |
        <a href="#gallery">Gallery</a> |
        <a href="#contact">Contact</a> |
        <a href="#video">Video</a>
    </nav>

    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my one-page HTML website assignment.</p>
    </section>

    <section id="gallery">
        <h2>Picture Gallery</h2>

        <!-- Image from images folder -->
        <img src="images/dog.jpg" alt="Dog" width="300">
    </section>

    <section id="contact">
        <h2>Contact Form</h2>

        <form>
            <input type="text" placeholder="Enter your name"><br><br>

            <input type="email" placeholder="Enter your email"><br><br>

            <input type="submit" value="Submit">
        </form>
    </section>

    <section id="video">
        <h2>Dog Video</h2>

        <!-- Video from video folder -->
        <video width="400" controls>
            <source src="video/dog.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

    </section>

    <footer>
        <p>My One Page Website Assignment</p>
    </footer>

</body>
</html>
