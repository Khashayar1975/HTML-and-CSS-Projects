<!DOCTYPE html>
<html lang="en">
<head>
    <title>One Page Website</title>
</head>
<body>

<nav>
    <a href="#home">Home</a> |
    <a href="#gallery">Gallery</a> |
    <a href="#contact">Contact</a> |
    <a href="#video">Video</a>
</nav>

<section id="home">
    <h1>Welcome to My Website</h1>
    <p>This is my one-page HTML website assignment.</p>
</section>

<section id="gallery">
    <h2>Picture Gallery</h2>
    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a" alt="Dog" width="300">
</section>

<section id="contact">
    <h2>Contact Form</h2>
    <form>
        <input type="text" placeholder="Enter your name"><br><br>
        <input type="email" placeholder="Enter your email"><br><br>
        <input type="submit" value="Submit">
    </form>
</section>

<section id="video">
    <h2>Dog Video</h2>
    <p>
        <a href="https://www.youtube.com/watch?v=2I4eUIJ_I8g" target="_blank">
            Click here to watch the dog video
        </a>
    </p>
</section>

<footer>
    <p>My One Page Website Assignment</p>
</footer>

</body>
</html>
